[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novel-studio"
version = "0.1.0"
description = "AI 小说创作辅助工具：浏览器即用，4-Agent 工作流 + RAG 一致性"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    # Web 框架
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    # 数据校验 / 配置
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    # LLM / Embedding
    "openai>=1.0.0",
    "httpx>=0.27.0",
    # 向量检索
    "faiss-cpu>=1.7.4",
    "numpy>=1.24",
    "openharness-ai>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PIE"]
ignore = ["E501"]  # 长行交给 formatter

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
